"bosses"
{
	"0" // Level 1: Crystal
	{
		"name"              "Crystal"
		"method"            "hpbar"
		// The engine names the counter "hpcounter2": names are pooled case-insensitively and
		// an output spells it that way first in the BSP. BossHP looks entities up with a
		// case-sensitive compare, so "HPCounter2" was never found and the boss was dropped
		// (18/11 and 22/11/2026, reproduced on the test server).
		// OutValue starts the bar with the first boss_teleport Add instead of after bar 1.
		"trigger"           "hpcounter2:OutValue"

		"counter"           "hpcounter2"
		"iterator"          "HPCounterIterator2"
		// Before the last bar the iterator is already at 1 and the counter at 0 until
		// hp_counter_set refills it 0.1 s later: BossHP saw 0 HP and ended the boss one bar
		// early (test server, 22/11/2026). With 1 extra HP it ends when the map kills the counter.
		"offset"            "1"
	}
	"1" // Level 1: Laser Crystal
	{
		"name"              "Crystal"
		"method"            "counter"
		"trigger"           "boss_to_blade2:OnStartTouch"

		"counter"           "blade_hp"
	}
	"2" // Level 2: Light
	{
		"name"              "Light"
		"method"            "breakable"
		"trigger"           "st2_hitbox:OnTakeDamage"

		"breakable"         "st2_hitbox"
	}
	"3" // Level 3: Light (Main)
	{
		"name"              "Light"
		"method"            "counter"
		"trigger"           "st3_goto:OnStartTouch"

		"counter"           "st3_hp"
	}
	"4" // Level 3: Light (Lasers)
	{
		"name"              "Light"
		"method"            "counter"
		"trigger"           "final_slow_push:OnStartTouch"

		"counter"           "final_hp"
	}
}
