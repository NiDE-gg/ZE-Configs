;ze_siege_of_persepolis_v1_0fix -- Stripper fixes -- Last Updated August 4th, 2026.
;Thanks to NiDE for helping with testing the map before and after Stripper changes were made.
;Extra comment -- If your server has a hitmarkers plugin of sorts, please disable it as this map uses custom overlays of its own and will cause flickering.

;------------------------------------
; 			General Stuff
;------------------------------------

;Adds Stripper debug message.

modify:
{
	match:
	{
		"classname" "logic_auto"
	}
	insert:
	{
		"OnMapSpawn" "main_script,RunScriptCode,chat_uk(`Calibrating retrofit to 040826 units -- Calibration complete! Good luck!`),6,1"
	}
}

;Delay zombie spawns a little bit more.

modify:
{
	match:
	{
		"targetname" "level_case"
	}
	delete:
	{
		"OnCase01" "main_consoleCommandzr_infect_spawntime_max 2501"
		"OnCase01" "main_consoleCommandzr_infect_spawntime_min 2501"
	}
	insert:
	{
		"OnCase01" "main_console,Command,zr_infect_spawntime_max 26,0,1"
		"OnCase01" "main_console,Command,zr_infect_spawntime_min 26,0,1"
	}
}

;Increases the damage of curses a bit more.

modify:
{
	match:
	{
		"targetname" "curse_aoe_hurt"
	}
	delete:
	{
		"OnStartTouch" "main_hurtAddOutputdamage 601"
	}
	insert:
	{
		"OnStartTouch" "main_hurt,AddOutput,damage 7,0,1"
	}
}

modify:
{
	match:
	{
		"targetname" "curse_crouch_hurt"
	}
	delete:
	{
		"OnStartTouch" "main_hurtAddOutputdamage 601"
	}
	insert:
	{
		"OnStartTouch" "main_hurt,AddOutput,damage 7,0,1"
	}
}

modify:
{
	match:
	{
		"targetname" "curse_jump_hurt"
	}
	delete:
	{
		"OnStartTouch" "main_hurtAddOutputdamage 601"
	}
	insert:
	{
		"OnStartTouch" "main_hurt,AddOutput,damage 7,0,1"
	}
}

;------------------------------------
; 			Bosses' HP
;------------------------------------

modify:
{
	match:
	{
		"targetname" "tilmun_p2_relay"
	}
	delete:
	{
		"OnUser2" "main_hp_filterAddOutputOnPass tilmun_p2_phys:AddHealth:5500:0:-10.11"
	}
	insert:
	{
		"OnUser2" "main_hp_filter,AddOutput,OnPass tilmun_p2_phys:AddHealth:4200:0:-1,0.1,1"
	}
}

modify:
{
	match:
	{
		"targetname" "npc_spawn_relay"
	}
	delete:
	{
		"OnTrigger" "main_ammo_filterAddOutputOnPass golem_phys:AddHealth:2200:0:-10.11"
	}
	insert:
	{
		"OnTrigger" "main_ammo_filter,AddOutput,OnPass golem_phys:AddHealth:1725:0:-1,0.1,1"
	}
}

;------------------------------------
; 			Warmup Round
;------------------------------------

;Toggles the "Now Loading" overlay more often so late joiners can see it too.

modify:
{
	match:
	{
		"targetname" "warmup_relay"
	}
	insert:
	{
		"OnUser3" "warmup_overlay,FireUser1,,12,1"
		"OnUser3" "warmup_overlay,FireUser1,,24,1"
		"OnUser3" "warmup_overlay,FireUser1,,36,1"
		"OnUser3" "warmup_overlay,FireUser1,,48,1"
		"OnUser3" "warmup_overlay,FireUser1,,60,1"
	}
}

;------------------------------------
; 			Episode I
;------------------------------------

;------------------
; Persepolis
;------------------

;Shifts these two teleports on the right side to prevent a TP avoidance spot.

modify:
{
	match:
	{
		"targetname" "s1_persepolis_hold3r_tp_all"
	}
	replace:
	{
		"origin" "2928 -4400 -10624"
	}
}

modify:
{
	match:
	{
		"targetname" "s1_persepolis_hold3r_tp"
	}
	replace:
	{
		"origin" "2928 -4400 -10656"
	}
}

;------------------
; Nobleman
;------------------

;Makes it so that only one Ice Thane spawns when King Tilmun is at 60% health as opposed to two at 65% and 30% health.

modify:
{
	match:
	{
		"targetname" "tilmun_p2_compare_a"
	}
	replace:
	{
		"CompareValue" "0.6"
	}
}

filter:
{
	"targetname" "tilmun_p2_compare_b"
}

;Reduces the rate at which King Tilmun and the Ice Thane attack.

modify:
{
	match:
	{
		"targetname" "tilmun_p2_attack_timer"
	}
	replace:
	{
		"RefireTime" "12"
	}
}


modify:
{
	match:
	{
		"targetname" "golem_attack_timer"
	}
	replace:
	{
		"RefireTime" "24"
	}
}

;Makes King Tilmun lose health when the Ice Thane is defeated.


modify:
{
	match:
	{
		"targetname" "golem_phys"
	}
	insert:
	{
		"OnBreak" "main_hp_filter,AddOutput,OnPass tilmun_p2_phys:RemoveHealth:5200:0.08:-1,0.1,1"
		"OnBreak" "main_hp_zone,FireUser1,,0.15,1"
	}
}

;------------------------------------
; 			Episode II
;------------------------------------

;------------------
; Babylonia
;------------------

;Fixes a typo.

modify:
{
	match:
	{
		"targetname" "s2_babylonia_hold5_tg"
	}
	delete:
	{
		"OnTrigger" "main_scriptRunScriptCodechat_rd(`Oh! I'm connected to A.M.I.G.O. visual output`)61"
	}
	insert:
	{
		"OnTrigger" "main_script,RunScriptCode,chat_rd(`Oh! I'm connected to A.M.I.G.O.'s visual output`),6,1"
	}
}

;------------------
; Legion and Nuculais
;------------------

;Change the speedrate at which Perfect King Tilmun attacks.

modify:
{
	match:
	{
		"targetname" "nuculais_start_relay"
	}
	delete:
	{
		"OnTrigger" "s2_boss_atk_timerRefireTime132.051"
	}
	insert:
	{
		"OnTrigger" "s2_boss_atk_timer,RefireTime,11,2.05,1"
	}
}

;Remove PickRandomShuffle from Perfect King Tilmun's attacks.

modify:
{
	match:
	{
		"targetname" "s2_boss_branch"
	}
	delete:
	{
		"OnTrue" "nuculais_atk_casePickRandomShuffle0-1"
	}
	insert:
	{
		"OnTrue" "nuculais_atk_case,PickRandom,,0,-1"
	}
}

;------------------
; Hyposelenia
;------------------

;Parents the tp destination to the elevator to prevent ztele out of bounds issue.

modify:
{
	match:
	{
		"targetname" "s2_hyposelenia_hold0_td_hm"
	}
	insert:
	{
		"parentname" "s2_hyposelenia_hold0_door"
	}
}

;Changes this flippin text and also removes an output to prevent possible "fake wins".

modify:
{
	match:
	{
		"targetname" "s2_hyposelenia_hold0_door"
	}
	delete:
	{
		"OnUser3" "main_scriptRunScriptCodechat_am(`Good bye -- Amigos.`)1031"
		"OnUser1" "level_counterSetValue3118.051"
	}
	insert:
	{
		"OnUser3" "main_script,RunScriptCode,chat_am(`Adios -- Amigos.`),103,1"
	}
}

modify:
{
	match:
	{
		"classname" "trigger_multiple"
		"hammerid" "927752"
	}
	insert:
	{
		"OnStartTouch" "level_counter,SetValue,3,0.05,1"
	}
}

;Changelog

;July 7th
;- All of my delete blocks were incorrect, which means that most of the balance changes didn't even work in the previous Stripper lmao. (Which means the map's been balanced correctly from the start).
;- Increased the damage of curses from 6 to 7.
;- Delayed zombie spawn on Episode I by one second.
;- Fixed a typo in Episode II Babylonia.
;- Reduced the cooldown between attackins for Perfect King Tilmun from 13 to 11 seconds.
;- Removed PickRandomShuffle from Perfect King Tilmun's attacks.
;- Corrected a messaged at the end of Episode II.

;August 4th
;- Added Stripper debug message.
;- Moved teleport triggers in Persepolis to avoid TP avoidance.
;- Lowered the health of King Tilmun and Ice Thane.
;- Made it so that killing the Ice Thane removes 15% of King Tilmun's health.
;- Increased attack rate for both King Tilmun and Ice Thane.
;- Made it so that only one NPC spawns at 60% HP instead of two at 65% and 30% HP.
;- Parented a teleport at Hyposelenia Peak to prevent unintended out of bounds when doing ztele.
;- Removed an output from the auto-trigger and added it somewhere else to prevent "fake wins".