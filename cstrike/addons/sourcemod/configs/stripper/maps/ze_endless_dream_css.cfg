; Give players the same default loadout as in the new VMF.
add:
{
    "classname" "game_player_equip"
    "spawnflags" "0"
    "weapon_elite" "1"
    "weapon_hegrenade" "1"
    "weapon_knife" "1"
    "weapon_tmp" "1"
    "origin" "835 1824 736"
}


; ------------------------------------------------------------
; Disable func_button press sounds for ALL Human/ZM abilities.
; New VMF uses: "sounds" "0" (None).
; Admin buttons are intentionally untouched.
; ------------------------------------------------------------

