; ze_endless_dream_css - compatibility stripper

; Stage 5 - Disorder
modify:
{
    match:
    {
        "classname" "logic_case"
        "targetname" "st5_1_boss_Disorder_case"
    }
    delete:
    {
        "OnCase01" "st5_boss_zmattack_tp,SetRemoteDestination,tp_des_5_Disorder_1,0,-1"
        "OnCase02" "st5_boss_zmattack_tp,SetRemoteDestination,tp_des_5_Disorder_2,0,-1"
    }
    insert:
    {
        "OnCase01" "st5_boss_zmattack_tp,AddOutput,origin -8544 -11264 -14192,0,-1"
        "OnCase02" "st5_boss_zmattack_tp,AddOutput,origin -13984 -11264 -14192,0,-1"
    }
}

