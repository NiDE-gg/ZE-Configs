;--------------------------------------------------------------------
; Fix yellow fade fading every player
;--------------------------------------------------------------------
modify:
{
	match:
	{
		"targetname" "Banana_Hurt"
		"classname" "trigger_hurt"
	}
	delete:
	{
		"OnHurtPlayer" "Map_YellowFade0-1"
	}
	insert:
	{
		"OnHurtPlayer" "!selfRunScriptCodeScreenFade(activator,255,255,0,255,2,0,9)0-1"
	}
}

