;-----------------------------------------
; Fix teleport velocity issue
;-----------------------------------------
modify:
{
	match:
	{
        "origin" "0 -11528 -304"
        "classname" "logic_auto"
	}
	insert:
	{
        "OnMapSpawn" "commandsCommandsay <> Stripper fix applied <>5-1"
	}
}
modify:
{
    match:
    {
        "classname" "trigger_teleport"
    }
    insert:
    {
        "OnStartTouch" "!activatorAddOutputabsvelocity 0 0 00-1"
        "OnStartTouch" "!activatorAddOutputbasevelocity 0 0 00-1"
    }
}