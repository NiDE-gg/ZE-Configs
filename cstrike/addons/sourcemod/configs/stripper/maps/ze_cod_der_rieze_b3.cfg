		"message" "#weapons/nide/powered_weapons_sound_2.wav"
	}
}
; the music got louder every round: der_rize_ambient.mp3 (15.5 min) starts every round, and a NOT looped
; ambient_generic is never stopped when the round restart removes it - the old copy plays on under the new one.
; Without the "is NOT looped" flag (32) the engine stops it at the round restart; the mp3 has no loop points, so
; it still plays once. Same for the easter egg song (10 min).
modify:
{
	match:
	{
		"classname" "ambient_generic"
		"targetname" "ambient"
	}
	replace:
	{
		"spawnflags" "17"
	}
}

modify:
{
	match:
	{
		"classname" "ambient_generic"
		"targetname" "eesong"
	}
	replace:
	{
		"spawnflags" "17"
	}
}

; the round start / round change ("lightning") and pick-up sounds were played from EVERY player at once - louder
; the more players stood together. ze_cod_der_rieze/hotfix1.nut runs the map's own der_rieze.nut, then plays those
; sounds once to each player instead.
modify:
{
	match:
	{
		"classname" "logic_script"
		"targetname" "der_rieze_script"
	}
	replace:
	{
		"vscripts" "ze_cod_der_rieze/hotfix1.nut"
	}
}
