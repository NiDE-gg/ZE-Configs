modify:
{
	match:
	{
		"origin" "7817 8303 -935.39"
		"targetname" "cream_use_stand"
		"classname" "logic_relay"
	}
	delete:
	{
		"OnUser1" "cream_use_E_pre,SetValue,0,25,-1"
	}
	insert:
	{
		"OnUser1" "cream_use_E,Disable,,20,-1"
	}
}

