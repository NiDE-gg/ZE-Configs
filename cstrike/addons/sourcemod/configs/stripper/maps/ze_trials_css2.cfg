;Disable Bhop & Remove old Boss system stage 3
modify:
{
	match:
	{
		"classname" "logic_auto"
		"origin" "-6656 -10112 32"
	}
	insert:
	{
		"OnMapSpawn" "servercommandCommandsv_enablebunnyhopping 00-1"
		"OnMapSpawn" "level_3_boss_breakableKill0-1"
	}
}

;Add More BossHP stage 1
modify:
{
	match:
	{
		"classname" "trigger_multiple"
		"targetname" "level_1_boss_trigger_multiple"
	}
	delete:
	{
		"OnStartTouch" "level_1_boss_hp_addAdd450-1"
	}
	insert:
	{
		"OnStartTouch" "level_1_boss_hp_addAdd1350-1"
	}
}
modify:
{
	match:
	{
		"classname" "math_counter"
		"targetname" "level_1_boss_hp_add"
	}
	replace:
	{
		"max" "5500"
	}
}
modify:
{
	match:
	{
		"classname" "trigger_once"
		"targetname" "Level_1_Boss_Start_Trigger"
	}
	insert:
	{
		"OnPass" "level_1_boss_hpSetValue1000-1"
	}
}
modify:
{
	match:
	{
		"classname" "math_counter"
		"targetname" "level_1_boss_hp"
	}
	insert:
	{
		"OnHitMin" "!selfSetValue1000-1"
	}
}
modify:
{
	match:
	{
		"classname" "logic_relay"
		"targetname" "level_1_boss_hp_add_relay"
	}
	delete:
	{
		"OnTrigger" "level_1_boss_hp_addGetValue0.2-1"
		"OnTrigger" "level_1_boss_trigger_multipleDisable0.5-1"
		"OnTrigger" "level_1_boss_hp_addSetValue1000.7-1"

	}
	insert:
	{
		"OnTrigger" "level_1_boss_hp_addGetValue0.1-1"
		"OnTrigger" "level_1_boss_trigger_multipleDisable0.2-1"
		"OnTrigger" "level_1_boss_hp_addSetValue1000.3-1"
	}
}

