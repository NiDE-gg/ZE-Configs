;---------------------------------------------------------------------------------
; Secret stage (true ending) only after the map was beaten (#24)
; Same method as ze_mist_v1_3: secret_unlock_check is spawned once from a template
; and turned into an info_target, so its value survives the round restarts.
;---------------------------------------------------------------------------------
add:
{
	"classname" "point_template"
	"targetname" "secret_unlock_template"
	"Template01" "secret_unlock_check"
	"spawnflags" "2"
	"origin" "-488 1440 9"
}
add:
{
	"classname" "info_target"
	"targetname" "secret_unlock_init"
	"spawnflags" "0"
	"origin" "-488 1408 9"
	"OnUser1" "secret_unlock_template,ForceSpawn,,0,-1"
	"OnUser1" "secret_unlock_check,AddOutput,classname info_target,0.03,-1"
	"OnUser1" "!self,Kill,,0.06,-1"
}
add:
{
	"classname" "logic_branch"
	"targetname" "secret_unlock_check"
	"InitialValue" "0"
	"origin" "-488 1376 9"
	"OnTrue" "system_secret_activated,SetValue,1,0,-1"
	"OnTrue" "server,Command,say ***[Secret] True Ending for next Round Activated***,2,-1"
	"OnFalse" "server,Command,say ***[Secret] Beat the map first to unlock the True Ending***,2,-1"
}
modify:
{
	match:
	{
		"classname" "logic_auto"
		"hammerid" "3941"
	}
	insert:
	{
		"OnMapSpawn" "secret_unlock_init,FireUser1,,0,-1"
	}
}
; the Fate Gears now ask secret_unlock_check instead of activating the true ending
modify:
{
	match:
	{
		"classname" "math_counter"
		"targetname" "system_secret_math"
	}
	delete:
	{
		"OnHitMin" "system_secret_activated,SetValue,1,0,1"
		"OnHitMin" "server,Command,say ***[Secret] True Ending for next Round Activated***,2,1"
	}
	insert:
	{
		"OnHitMin" "secret_unlock_check,Test,,0,1"
	}
}
; final boss of the normal map killed: unlock
modify:
{
	match:
	{
		"classname" "math_counter"
		"targetname" "lvl4_finalboss_counter"
	}
	insert:
	{
		"OnHitMin" "secret_unlock_check,SetValue,1,0,1"
		"OnHitMin" "server,Command,say ***[Secret] True Ending unlocked: find the Fate Gears***,3,1"
	}
}
; the true ending starts: lock again until the map is beaten once more
modify:
{
	match:
	{
		"classname" "logic_branch"
		"targetname" "system_secret_activated"
	}
	insert:
	{
		"OnTrue" "secret_unlock_check,SetValue,0,5,-1"
	}
}
