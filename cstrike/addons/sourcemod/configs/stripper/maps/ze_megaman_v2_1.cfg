;-----------------------------------------------------------------
; Wily Golem: kill AFKs in spawn after the intro camera (was 10 s)
;-----------------------------------------------------------------
modify:
{
	match:
	{
		"classname" "trigger_once"
		"hammerid" "22003903"
	}
	delete:
	{
		"OnStartTouch" "w_golem_spawn_hurtEnable101"
	}
	insert:
	{
		"OnStartTouch" "w_golem_spawn_hurtEnable251"
	}
}

