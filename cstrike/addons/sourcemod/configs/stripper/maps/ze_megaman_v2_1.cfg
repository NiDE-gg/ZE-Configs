;---------------------------------------------------------------------------
; Edict crash on stage win with many CTs alive (64 players): at round end
; strip living players' weapons and remove what is parented to them, same as
; slaying them. The next BSP (scripts v105) does this itself.
;---------------------------------------------------------------------------
add:
{
	"classname" "logic_script"
	"targetname" "nide_limpieza_jugadores"
	"origin" "856 8176 -10140"
	"vscripts" "ze_megaman/limpieza_jugadores.nut"
}

;-----------------------------------------------
; Charge Man log room barrier: hold 5 s (was 10)
;-----------------------------------------------
modify:
{
	match:
	{
		"classname" "math_counter"
		"hammerid" "15552246"
	}
	delete:
	{
		"OnHitMax" "Charge_Electric_HurtKill111"
		"OnHitMax" "Charge_Electric_ClipKill111"
		"OnHitMax" "megaman_logic_scriptRunScriptCodeClientPrint(null, 3, ``+LightBlue+`[`+Blue+`MAP`+LightBlue+`]`+White+` >>>Hold for 10 seconds<<<`)11"
	}
	insert:
	{
		"OnHitMax" "Charge_Electric_HurtKill61"
		"OnHitMax" "Charge_Electric_ClipKill61"
		"OnHitMax" "megaman_logic_scriptRunScriptCodeClientPrint(null, 3, ``+LightBlue+`[`+Blue+`MAP`+LightBlue+`]`+White+` >>>Hold for 5 seconds<<<`)11"
	}
}

