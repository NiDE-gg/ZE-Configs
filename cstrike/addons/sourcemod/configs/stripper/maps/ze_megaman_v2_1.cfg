; SubTank heal: when its 4 s immunity ends inside spawn, give spawn immunity back (it used to drop to NoFallDamage and players got infected in spawn)
;----------------------------------------------------------------------------------------------------------------------------------------------------
modify:
{
	match:
	{
		"classname" "trigger_hurt"
		"hammerid" "18556453"
	}
	delete:
	{
		"OnStartTouch" "!activatorSetDamageFilterNoFallDamage4-1"
		"OnEndTouch" "!activatorSetDamageFilterNoFallDamage0-1"
	}
	insert:
	{
		"OnStartTouch" "!activatorRunScriptCode::NideFiltroCura(self)4-1"
		"OnEndTouch" "!activatorRunScriptCode::NideFiltroCura(self)0-1"
	}
}

;-------------------------------------------------------------------------------------------
; Charge Man escape: the ZM teleport above the arena (mm5cha_zmtp_bossarena) lives until 9 s, when zombies are moved (escape tp 8 -> 9 s)
; Zombies teleported into the cargo for the escape face 270 (mm5cha_zmcargo_tpdest was 90)
;-------------------------------------------------------------------------------------------
modify:
{
	match:
	{
		"classname" "logic_relay"
		"hammerid" "16353720"
	}
	delete:
	{
		"OnTrigger" "mm5cha_zmtp_bossarenaKill0-1"
		"OnTrigger" "mm5cha_bossarena_zmtp_escapeEnable8-1"
	}
	insert:
	{
		"OnTrigger" "mm5cha_zmtp_bossarenaKill9-1"
		"OnTrigger" "mm5cha_zmtp_bossarenaRunScriptCodeNetProps.SetPropEntity(self, `m_hFilter`, Entities.FindByName(null, `Zombies`))0-1"
		"OnTrigger" "mm5cha_bossarena_zmtp_escapeEnable9-1"
		"OnTrigger" "mm5cha_zmcargo_tpdestAddOutputangles 0 270 00-1"
	}
}

