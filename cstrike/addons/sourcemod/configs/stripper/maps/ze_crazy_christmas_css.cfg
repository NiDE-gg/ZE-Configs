;--------------------------------------------------------------------
; Fix green fade from zm item, fading everyone
;--------------------------------------------------------------------
modify:
{
	match:
	{
		"targetname" "poisonbox_tr"
		"classname" "trigger_multiple"
	}
	delete:
	{
		"OnStartTouch" "player_poisonFade0-1"
		"OnStartTouch" "player_poison_reverseFade3-1"
	}
	insert:
	{
		"OnStartTouch" "!selfRunScriptCodeScreenFade(activator,61,236,0,255,2,1,1)0-1"
	}
}

