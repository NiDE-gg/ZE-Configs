; Increase logic_timer refire time that spawns horizontal lasers on stage 7
modify:
{
	match:
	{
		"origin" "4192 6964 1720"
		"targetname" "lt_2_2"
		"classname" "logic_timer"
	}
	replace:
	{
		"RefireTime" ".3"
	}
}

