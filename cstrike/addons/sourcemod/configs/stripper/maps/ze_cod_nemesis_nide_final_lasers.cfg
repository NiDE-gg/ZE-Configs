;map by Lardy
;ze_cod_nemesis_nide_final_lasers

; Update vscript path
modify:
{
	match:
	{
		"targetname" "nemesis_nide_script"
		"classname" "logic_script"
	}
	replace:
	{
		"vscripts" "ze_cod_nemesis_nide_final_lasers/nemesis_nide.nut"
	}
}

; changing mz ratio on all stages to make the map being more balanced

;stage1
modify:
{
	match:
	{
		"targetname" "logic_relay_lvl1"
		"classname" "logic_relay"
	}
	delete:
	{
		"OnTrigger" "server_command,Command,zr_infect_mzombie_ratio 15,0,1"
	}
	insert:
	{
		"OnTrigger" "server_command,Command,zr_infect_mzombie_ratio 10,0,1"
	}
}
