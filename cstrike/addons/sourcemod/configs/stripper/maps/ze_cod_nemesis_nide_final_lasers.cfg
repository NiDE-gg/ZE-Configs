; update shop prices and swap Juggernog/Mystery Box activation order

modify:
{
	match:
	{
		"targetname" "button_power_on"
		"classname" "func_button"
	}
	delete:
	{
		"OnPressed" "server_command,Command,say ** ...Activating Juggernog... **,7,-1"
		"OnPressed" "server_command,Command,say ** ...Activating MyseryBox... **,19,-1"
		"OnPressed" "juggernog_trigger,Enable,,9,-1"
		"OnPressed" "juggernog_worldtext,AddOutput,message 8000$,9,-1"
		"OnPressed" "tombstone_worldtext,AddOutput,message 13000$,17,-1"
		"OnPressed" "speed_cola_text,AddOutput,message 5000$,13,-1"
		"OnPressed" "mystery_box_trigger*,Enable,,21,-1"
		"OnPressed" "mystery_box_price*,AddOutput,message 3000$,21,-1"
		"OnPressed" "double_tap_worldtext,AddOutput,message 5000$,25,-1"
		"OnPressed" "port_trap_price,AddOutput,message 500$,0,-1"
	}
	insert:
	{
		"OnPressed" "server_command,Command,say ** ...Activating MyseryBox... **,7,-1"
		"OnPressed" "server_command,Command,say ** ...Activating Juggernog... **,19,-1"
		"OnPressed" "mystery_box_trigger*,Enable,,9,-1"
		"OnPressed" "mystery_box_price*,AddOutput,message 300$,9,-1"
		"OnPressed" "juggernog_trigger,Enable,,21,-1"
		"OnPressed" "juggernog_worldtext,AddOutput,message 1500$,21,-1"
		"OnPressed" "tombstone_worldtext,AddOutput,message 1000$,17,-1"
		"OnPressed" "speed_cola_text,AddOutput,message 700$,13,-1"
		"OnPressed" "double_tap_worldtext,AddOutput,message 800$,25,-1"
		"OnPressed" "port_trap_price,AddOutput,message 25$,0,-1"
	}
}