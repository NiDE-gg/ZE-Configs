; increasing the fire of the logic_timer that spawn horizontal lasers on stage 7 at the end

modify:
{
	match:
	{
		"origin" "4192 6964 1720"
		"targetname" "lt_2_2"
		"classname" "logic_timer"
	}
	replace:
	{
		"RefireTime" ".3"
	}
}
