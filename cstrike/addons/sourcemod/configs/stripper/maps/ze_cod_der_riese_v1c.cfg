;map: ze_cod_der_riese_v1c
;der_rieze.nut handles these triggers: E inside a trigger buys the door or
;links the teleporter, and the carried item does not fire on the same press.
;filter_ct: only humans touch them, zombies passing the doors cost nothing.

; Update vscript path: the BSP packs the old scripts/vscripts/der_rieze.nut,
; which would load instead of the new one.
modify:
{
	match:
	{
		"targetname" "der_rieze_script"
		"classname" "logic_script"
	}
	replace:
	{
		"vscripts" "ze_cod_der_rieze/der_rieze.nut"
	}
}

; Doors: one trigger per door, disabled until the door's round, killed by the
; script when the door opens. *80 = doors along X, *83 = doors along Y.
; The debris keep the old system (E on the debris itself).

; door1 - Juggernog Door
add:
{
	"classname" "trigger_multiple"
	"targetname" "door1_trigger"
	"model" "*80"
	"origin" "846 -38 36.5"
	"spawnflags" "1"
	"StartDisabled" "1"
	"filtername" "filter_ct"
	"wait" ".1"
}
