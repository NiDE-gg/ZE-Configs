;-------------------
; Remove AFK Killer
;-------------------
filter:
{
    "targetname" "afk_killer"
}

filter:
{
    "targetname" "afk_relay"
}

;----------------------
; Increase nuke damage
;----------------------
modify:
{
    match:
    {
        "targetname" "final_nuke"
        "classname" "trigger_hurt"
    }
    replace:
    {
        "damage" "100000"
    }
}

;--------------------------------------------------------------------------------
; AFK teleport to the tramway (#181)
; noob_tele_a3 only brings the AFK players of defense 2 to the start of the bridge
; (noob_tele_a3_t, 1011 7168), and nothing covers the bridge and the cliff: AFK
; humans never reach the tramway. 30 s after the final button (60 s before the
; tramway leaves), the humans on the bridge are sent into the tramway cabin.
; The brush is the one of noob_tele_a3 (*199), moved 2766 units north:
; x -128..3392 y 5326..9550 and x -128..832 y 9550..10254, z 888..1912
; (the final platform is at z 1920, from y 9600).
;--------------------------------------------------------------------------------
add:
{
    "classname" "info_teleport_destination"
    "targetname" "afk_tele_final_dest"
    "origin" "1344 10080 1925"
    "angles" "0 90 0"
}
add:
{
    "classname" "trigger_teleport"
    "targetname" "afk_tele_final"
    "model" "*199"
    "origin" "1632 7790 1400"
    "target" "afk_tele_final_dest"
    "filtername" "human yes"
    "StartDisabled" "1"
    "spawnflags" "1"
}
modify:
{
    match:
    {
        "targetname" "button_defense_final"
        "classname" "func_button"
    }
    insert:
    {
        "OnPressed" "consolesays,Command,say **AFK humans teleported to the tramway in 5 seconds**,25,-1"
        "OnPressed" "afk_tele_final,Enable,,30,-1"
    }
}
