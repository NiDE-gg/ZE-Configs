; Stripper is loaded
modify:
{
	match:
	{
		"classname" "logic_auto"
		"hammerid" "2117156"
	}
	insert:
	{
		"OnMapSpawn" "cmd,Command,say **Stripper v1.0 loaded**,0.25,-1"
	}
}

; Modify spawn position of an item not reachable on stage 4 start
modify:
{
	match:
	{
		"targetname" "s4_human_item_location1"
		"classname" "logic_relay"
	}
	replace:
	{
		"origin" "-624 -2192 -4504"
	}
}

; Remove practice mode
filter:
{
	"targetname" "AdminRoom_ForceSelection_Practice"
	"classname" "func_button"
}
