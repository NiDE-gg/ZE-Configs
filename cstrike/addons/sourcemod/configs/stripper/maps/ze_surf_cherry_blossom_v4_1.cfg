;remove broken output
modify:
{
	match:
	{
		"targetname" "trigg"
		"origin" "12360 -7088 -2827.23"
		"classname" "trigger_hurt"
	}
	delete:
	{
		"OnHurt" "item_firework,FireUser1,,0,-1"
	}
}

;prevent human stuck in tree after TP
modify:
{
	match:
	{
		"targetname" "last_tele"
		"classname" "trigger_teleport"
		"hammerid" "155902"
	}
	replace:
	{
		"target" "des10"
	}
}

