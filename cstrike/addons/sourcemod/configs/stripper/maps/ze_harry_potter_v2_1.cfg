;------------------------------------------------
; STAGE 4/10 - KEEP THE WIZARD MINISTAGE GOING
; WHEN A DOOR IS BROKEN BY HAND
;------------------------------------------------

; Breaking stage3_wizstg1_break1/2/3 by hand (when a lever seems stuck) skipped
; map_switch_case OnCase01 or stage3_wizstg1_counter1 OnHitMin, so levers 2/3 never
; spawned and the dragons stayed invisible (#90). Their outputs are all once-only,
; so firing them again after the normal path is a no-op (checked on MAPS TEST 2026-11-18).
