;------------------------------------------------
; STAGE 4/10 - TRI-WIZARD CUP COLLECTOR CHECK
;------------------------------------------------

; Every second stage3_wizard_cd_timercol enables stage3_wizard_cd_trigcol and then fires
; stage3_wizard_cd_branch ("THE COLLECTOR DIED", restart) unless the trigger saw the
; collector (CT, named wizardcollector) first. That trigger rides on the carried item, which
; the pickup puts on the player's "eholster" attachment. 38 of 357 custom player models on
; our servers have no eholster: the item then stays where it was picked up and the trigger
; can miss its carrier, failing the mode with a living human collector (#90).
; Add a second check with the same filter over the whole map (brush of map_flycar_ptrig),
; so the collector is found wherever the item hangs. A dead or infected collector still fails.
add:
{
	"classname" "trigger_multiple"
	"targetname" "stage3_wizcollector_trig"
	"model" "*712"
	"origin" "1 2 3"
	"spawnflags" "1"
	"StartDisabled" "1"
	"wait" "0"
	"filtername" "filter_stg3_wizard_multi"
	"OnStartTouch" "!self,Disable,,0,-1"
	"OnStartTouch" "stage3_wizard_cd_branch,Disable,,0,-1"
}
modify:
{
	match:
	{
		"targetname" "stage3_wizard_cd_timercol"
		"classname" "logic_timer"
	}
	insert:
	{
		"OnTimer" "stage3_wizcollector_trig,Enable,,0.25,-1"
	}
}

;-------------------------
; CLIENT CRASH MITIGATION
;-------------------------

;Weather (rain): off by default, one copy of each rain volume when an admin turns it on.
;The weather was filtered out in 2024 because it crashed clients. Cause, measured on MAPS TEST
;on 2026-11-18: map_adroom_opt_weather (extreme mode rounds, or every round once an admin turned
;it on) and map_adroom_comp_weather (admin room toggle) ForceSpawn the weathersys_temp_* templates
;6 times each, so every rain volume existed 6 times (more after each admin toggle). Rain shares
;the client dynamic vertex buffer with particles: with 6 copies, 120 item effects crashed the
;client ("AllocVertices ... failed"), while without rain the same 120 effects did not. With 1 copy
;the crash threshold was the same as without rain (120 effects held, 240 in ~10 s crashed, with
;or without rain), but rain still costs FPS (6 copies: 141 -> 93 in the city, 1 copy: 157 -> 146
;on stage 1), so it stays off by default (decision of 2026-11-19).
;Keep one ForceSpawn in each, clear the volumes before the admin toggle spawns them again, and
;stop extreme mode from turning it on: map_fx_perm1 OnUser1 is fired by map_stages_case_xtrm
;and new_check_override_fr_c only to enable it. The admin room toggle still turns it on.
modify:
{
	match:
	{
		"targetname" "map_fx_perm1"
		"classname" "func_brush"
	}
	delete:
	{
		"OnUser1" "map_adroom_opt_weather,Enable,,0,-1"
	}
}
modify:
{
	match:
	{
		"targetname" "map_adroom_opt_weather"
		"classname" "logic_relay"
	}
	delete:
	{
		"OnTrigger" "weathersys_temp_*,ForceSpawn,,0.2,1"
		"OnTrigger" "weathersys_temp_*,ForceSpawn,,0.3,1"
		"OnTrigger" "weathersys_temp_*,ForceSpawn,,0.4,1"
		"OnTrigger" "weathersys_temp_*,ForceSpawn,,0.5,1"
		"OnTrigger" "weathersys_temp_*,ForceSpawn,,0.6,1"
	}
}
modify:
{
	match:
	{
		"targetname" "map_adroom_comp_weather"
		"classname" "logic_compare"
	}
	delete:
	{
		"OnEqualTo" "weathersys_temp_*,ForceSpawn,,0.4,-1"
		"OnEqualTo" "weathersys_temp_*,ForceSpawn,,0.5,-1"
		"OnEqualTo" "weathersys_temp_*,ForceSpawn,,0.6,-1"
		"OnEqualTo" "weathersys_temp_*,ForceSpawn,,0.7,-1"
		"OnEqualTo" "weathersys_temp_*,ForceSpawn,,0.8,-1"
	}
	insert:
	{
		"OnEqualTo" "weathersys_trigger_*,Kill,,0.2,-1"
	}
}

;Item spell particles: kill them 2 s after they stop emitting instead of 10-15 s later.
;Incendio, Impedimenta and Crucio spawn new info_particle_systems on every use; they stop
;emitting after 4-6 s (Stop added by spx_<item>_case per upgrade level) but were only
;killed after 15 s (10 s for Crucio), so they kept filling the client dynamic vertex buffer
;that overflows into the "AllocVertices ... failed" crash (#90). Item damage (trigger_hurt)
;keeps its own timing.
modify:
{
	match:
	{
		"targetname" "spx_incendio_activator2"
		"classname" "logic_relay"
	}
	delete:
	{
		"OnTrigger" "spx_incendio_effect_active*,Kill,,15,-1"
	}
	insert:
	{
		"OnTrigger" "spx_incendio_effect_active*,Kill,,8,-1"
	}
}
modify:
{
	match:
	{
		"targetname" "spx_impedimenta_activator2"
		"classname" "logic_relay"
	}
	delete:
	{
		"OnTrigger" "spx_impedimenta_effect_active*,Kill,,15,-1"
	}
	insert:
	{
		"OnTrigger" "spx_impedimenta_effect_active*,Kill,,7,-1"
	}
}
modify:
{
	match:
	{
		"targetname" "spx_crucio_activator2"
		"classname" "logic_relay"
	}
	delete:
	{
		"OnTrigger" "spx_crucio_effect_active*,Kill,,10,-1"
	}
	insert:
	{
		"OnTrigger" "spx_crucio_effect_active*,Kill,,7,-1"
	}
}

;Stage 1: Disable item particles after boss fight to prevent client crash
;Killing the particles once is not enough: Incendio, Impedimenta and Crucio spawn a new
;info_particle_system (env_entity_maker template) on every use. Several uses at the last
;defence point overflow the client dynamic vertex buffer ("AllocVertices ... failed",
;16766160 vertices used) and the game closes (#90, reproduced on MAPS TEST 2026-11-18).
;From this point on, kill those particles as soon as they spawn (item damage is kept).
modify:
{
	match:
	{
		"targetname" "stage1_boss_ending"
		"classname" "trigger_once"
	}
	insert:
	{
		"OnStartTouch" "console,Command,say >>> DISABLING ITEMS PARTICLES TO PREVENT GAME CRASH <<<,0,1"
		"OnStartTouch" "info_particle_system,Kill,,0,1"
		"OnStartTouch" "spx_incendio_spwnr_entmaker,AddOutput,OnEntitySpawned spx_incendio_effect_active*:Kill::0:-1,0,1"
		"OnStartTouch" "spx_impedimenta_spwnr_entmaker,AddOutput,OnEntitySpawned spx_impedimenta_effect_active*:Kill::0:-1,0,1"
		"OnStartTouch" "spx_crucio_spwnr_entmaker,AddOutput,OnEntitySpawned spx_crucio_effect_active*:Kill::0:-1,0,1"
	}
}

