		"classname" "func_breakable"
	}
	insert:
	{
		"OnBreak" "stage3_wizstg1_counter1,SetValue,0,0,1"
	}
}
modify:
{
	match:
	{
		"targetname" "stage3_wizstg1_break3"
		"classname" "func_breakable"
	}
	insert:
	{
		"OnBreak" "stage3_wizstg1_counter1,SetValue,0,0,1"
	}
}

;------------------------------------------------
; STAGE 4/10 - LEVER BACKUP WHEN THE TOUCH IS MISSED
;------------------------------------------------

; Each wizard lever only fires when its map_switch_phys breakable touches a trigger_once.
; On MAPS TEST (2026-11-18) lever 3 swept into its trigger and stopped inside it without
; firing (#90). Count the time each wheel is held (0.5 s ticks) and run the lever's
; map_switch_case value once the wheel has been turned well past the usual trigger point
; (levers fire after about 5 to 10 s of holding): 14 s for lever 1, 10 s for levers 2/3.
; The counters start disabled and are enabled when their lever spawns (OnCase05 for
; lever 1, OnCase01 for levers 2/3), so turning a wheel early counts nothing. The
; map_switch_case outputs are once-only, so a backup after a normal trigger is a no-op.
add:
{
	"classname" "logic_timer"
	"targetname" "stage3_wizstg1_holdtimer1"
	"origin" "1298 -10805 -5300"
	"RefireTime" "0.5"
	"StartDisabled" "1"
	"OnTimer" "stage3_wizstg1_holdcount1,Add,1,0,-1"
}
add:
{
	"classname" "math_counter"
	"targetname" "stage3_wizstg1_holdcount1"
	"origin" "1298 -10805 -5300"
	"startvalue" "0"
	"min" "0"
	"max" "28"
	"StartDisabled" "1"
	"OnHitMax" "map_switch_case,InValue,1,0,1"
	"OnHitMax" "stage3_wizstg1_holdtimer1,Kill,,0,1"
}
