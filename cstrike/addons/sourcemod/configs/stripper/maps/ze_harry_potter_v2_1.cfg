;-----------------------
; STAGE 10 - FIX WHEELS
;-----------------------

modify:
{
	match:
	{
		"targetname" "stage3_ex_wizard_rbut1"
		"classname" "momentary_rot_button"
	}
	replace:
	{
		"distance" "68"
		"speed" "3"
	}
}
modify:
{
	match:
	{
		"targetname" "stage3_ex_wizard_rbut2"
		"classname" "momentary_rot_button"
	}
	replace:
	{
		"distance" "68"
		"speed" "3"
	}
}

;-------------------------
; CLIENT CRASH MITIGATION
;-------------------------

;Weather crash
filter:
{
	"targetname" "/weathersys_*/"
}
filter:
{
	"targetname" "map_adroom_opt_weather"
	"classname" "logic_relay"
}
filter:
{
	"targetname" "map_adroom_comp_weather"
	"classname" "logic_compare"
}

;Stage 1: Disable item particles after boss fight to prevent client crash
modify:
{
	match:
	{
		"targetname" "stage1_boss_ending"
		"classname" "trigger_once"
	}
	insert:
	{
		"OnStartTouch" "console,Command,say >>> DISABLING ITEMS PARTICLES TO PREVENT GAME CRASH <<<,0,1"
		"OnStartTouch" "info_particle_system,Kill,,0,1"
	}
}

;--------------------------------------------
; FIX PLAYER SIZE NOT BEING RESET ON RESPAWN
;--------------------------------------------

add:
{
	"targetname" "game_playerdie"
	"classname" "trigger_brush"
	"OnUse" "!activator,ClearContext,,0,-1"
	"OnUse" "!activator,AddOutput,modelscale 1,0,-1"
	"OnUse" "!activator,AddOutput,targetname ,0,-1"
}

