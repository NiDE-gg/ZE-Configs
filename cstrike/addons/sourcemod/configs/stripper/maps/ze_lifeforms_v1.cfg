; Stripper is loaded
modify:
{
	match:
	{
		"classname" "logic_auto"
		"hammerid" "2117156"
	}
	insert:
	{
		"OnMapSpawn" "cmd,Command,say **Stripper v1.0 loaded**,0.25,-1"
	}
}

