;--------------------------------------------
; CHANGE ZM HEAL COOLDOWN FOR EXTREME STAGES
;--------------------------------------------

modify:
{
	match:
	{
		"targetname" "leveltrigger_case"
		"classname" "logic_case"
	}
	insert:
	{
		"OnCase01" "command,Command,sm_ewsetcooldown 7256707 90,10,1"
		"OnCase02" "command,Command,sm_ewsetcooldown 7256707 90,10,1"
		"OnCase03" "command,Command,sm_ewsetcooldown 7256707 90,10,1"
		"OnCase04" "command,Command,sm_ewsetcooldown 7256707 30,10,1"
		"OnCase05" "command,Command,sm_ewsetcooldown 7256707 30,10,1"
		"OnCase06" "command,Command,sm_ewsetcooldown 7256707 30,10,1"
		"OnCase07" "command,Command,sm_ewsetcooldown 7256707 30,10,1"
	}
}

