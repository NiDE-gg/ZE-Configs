; ============================================================================
; ze_vermintide_v3 - Stripper:Source map config
;
; Map entity fixes that don't need the map recompiled (or the VMF touched): Stripper:Source changes the entity list as
; the map loads, on the server. Together with the VScript (scripts/vscripts/ze_vermintide_vscript/) this is where map
; fixes live while the VMF is being edited by hand.
;
; Install on the server: addons/stripper/maps/ze_vermintide_v3.cfg  (Stripper:Source must be installed; the file name
; must match the map's name exactly - lowercase). Changes take effect on the next map load.
;
; Syntax (each block lists keyvalues exactly as in the BSP / VMF; outputs use the BSP's comma form
; "target,input,parameter,delay,times"):
;
;   filter:              remove every entity matching ALL these keyvalues
;   {
;       "targetname" "some_entity"
;   }
;
;   add:                 add a new entity
;   {
;       "classname" "info_teleport_destination"
;       "targetname" "vt_new_dest"
;       "origin" "0 0 0"
;       "angles" "0 90 0"
;   }
;
;   modify:              change entities matching `match`
;   {
;       match:   { "targetname" "trigger_once_11" }
;       replace: { "wait" "2" }                                   ; change existing keyvalues
;       delete:  { "OnUser2" "horde_logic,RunScriptCode,..." }    ; remove these keyvalues / outputs
;       insert:  { "OnUser1" "horde_logic,CallScriptFunction,MapFinalStand,0,1" }   ; add keyvalues / outputs
;   }
;
; Lines starting with ; are comments. Keep each fix commented with what it does and why.
; ============================================================================

; ---------------------------------------------------------------------------- the live scripts (Dungeon Cartoon's way)
; The released BSP packs scripts/vscripts/ze_vermintide_vscript/ - a map's packed files win over the server's loose ones,
; so script changes since the release live in scripts/vscripts/ze_vermintide/ (a folder the BSP doesn't have -
; generated by ze_vermintide_vscript/compilepal/make_live.py). The map's horde_logic loads that instead.
; Roll back to the shipped scripts: delete this block (or point it at ze_vermintide_vscript/horde_system.nut).
modify:
{
	match:
	{
		"classname" "logic_script"
		"targetname" "horde_logic"
	}
	replace:
	{
		"vscripts" "ze_vermintide/horde_system.nut"
	}
}

; ---------------------------------------------------------------------------- only the escaped survive
; keep_portal_to_win (the Bridge of Shadows) tells the script about EVERY human going through (its own outputs fire only
; once): when the map kills the zombies 14 s after the first one (MapKillAllZombies), every human still in the map dies
; with them.
modify:
{
	match:
	{
		"classname" "trigger_teleport"
		"targetname" "keep_portal_to_win"
	}
	insert:
	{
		"OnStartTouch" "horde_logic,CallScriptFunction,MapEscaped,0,-1"
	}
}
