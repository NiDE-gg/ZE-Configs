;-------------------------------------------------------------
; AREA 1 -> AREA 3: the human teleport (*62) says "ZOMBIE TELEPORT
; IN 16 SECONDS" and moves the spawn teleport at 16 s, but it
; enabled WHOLE_A1_CONTINUE_TP (no filter, catches the zombies
; still in area 1) at 12 s. Align it on the announced 16 s.
;-------------------------------------------------------------
modify:
{
	match:
	{
		"model" "*62"
		"classname" "trigger_teleport"
	}
	delete:
	{
		"OnStartTouch" "WHOLE_A1_CONTINUE_TP,Enable,,12,1"
	}
	insert:
	{
		"OnStartTouch" "WHOLE_A1_CONTINUE_TP,Enable,,16,1"
	}
}
