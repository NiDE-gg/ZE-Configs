;---------------------------------------
; FIX SPLIT TELEPORT AT SPAWN AND ENDING
;---------------------------------------
filter:
{
	"classname" "info_teleport_destination"
	"targetname" "lv1_zombo_tp_end"
}
add:
{
	"classname" "logic_case"
	"origin" "936 -4701 -1428"
	"targetname" "lv1_zombo_tp_case"
	"OnCase01" "lv1_zombo_tp_end1,Teleport,,0,-1"
	"OnCase02" "lv1_zombo_tp_end2,Teleport,,0,-1"
	"OnCase03" "lv1_zombo_tp_end3,Teleport,,0,-1"
	"OnCase04" "lv1_zombo_tp_end4,Teleport,,0,-1"
}
add:
{
	"classname" "point_teleport"
	"origin" "907 -4701 -1427.5"
	"targetname" "lv1_zombo_tp_end1"
	"target" "!activator"
	"angles" "0 87 0"
}
add:
{
	"classname" "point_teleport"
	"origin" "2686 -2894 -1428.27"
	"targetname" "lv1_zombo_tp_end2"
	"target" "!activator"
	"angles" "0 172 0"
}
add:
{
	"classname" "point_teleport"
	"origin" "914 -1107 -1428.5"
	"targetname" "lv1_zombo_tp_end3"
	"target" "!activator"
	"angles" "0 269.5 0"
}
add:
{
	"classname" "point_teleport"
	"origin" "-881 -2880 -1428.5"
	"targetname" "lv1_zombo_tp_end4"
	"target" "!activator"
	"angles" "0 0.5 0"
}
modify:
{
	match:
	{
		"classname" "trigger_teleport"
		"targetname" "lv1_spawntp"
	}
	replace:
	{
		"classname" "trigger_multiple"
	}
	delete:
	{
		"target" "lv1_zombo_tp_end"
	}
	insert:
	{
		"OnStartTouch" "lv1_zombo_tp_case,PickRandomShuffle,,0,-1"
	}
}
modify:
{
	match:
	{
		"classname" "trigger_teleport"
		"targetname" "lv1_zombo_tp_end_all"
	}
	replace:
	{
		"classname" "trigger_multiple"
	}
	delete:
	{
		"target" "lv1_zombo_tp_end"
	}
	insert:
	{
		"OnStartTouch" "lv1_zombo_tp_case,PickRandomShuffle,,0,-1"
	}
}

;------------------------------------------
; DISABLE PRACTICE MODE UNTIL MAP IS BEATEN
;------------------------------------------
add:
{
	"classname" "logic_branch"
	"origin" "2536 -2792 -1628.5"
	"targetname" "practice_check"
	"InitialValue" "0"
	"OnTrue" "b_practice,Unlock,,0,-1"
}
modify:
{
	match:
	{
		"classname" "func_button"
		"targetname" "b_practice"
	}
	replace:
	{
		"spawnflags" "3073"
	}
	insert:
	{
		"OnUseLocked" "cmd,Command,say < PRACTICE MODE IS DISABLED UNTIL THE MAP IS BEATEN >,0,-1"
	}
}
modify:
{
	match:
	{
		"classname" "point_template"
		"targetname" "lvl_counter_temp"
	}
	insert:
	{
		"Template02" "practice_check"
	}
}
modify:
{
	match:
	{
		"classname" "info_target"
		"targetname" "lvl_init_counter"
	}
	insert:
	{
		"OnUser1" "practice_check,AddOutput,classname info_target,0.03,1"
	}
}
modify:
{
	match:
	{
		"classname" "logic_case"
		"targetname" "lvl_case"
	}
	insert:
	{
		"OnCase01" "LV1_HW_TP,AddOutput,OnStartTouch practice_check:SetValue:1:0:1,0,-1"
		"OnCase03" "LV1_HW_TP,AddOutput,OnStartTouch practice_check:SetValue:0:0:1,0,-1"
	}
}
modify:
{
	match:
	{
		"classname" "logic_auto"
	}
	insert:
	{
		"OnMapSpawn" "practice_check,Test,,0.02,1"
	}
}

